events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Headers CORS communs
    map $http_origin $cors_origin {
        default "*";
    }

    server {
        listen 80;

        # Auth
        location /api/auth/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $auth http://auth-service:8082;
            rewrite ^/api/auth/(.*) /api/auth/$1 break;
            proxy_pass $auth;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            # Supprimer les CORS headers du backend pour éviter les doublons
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            # Ajouter les nôtres
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # OffreRh
        location /api/offre/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $offre http://offre-service:8088;
            rewrite ^/api/offre/(.*) /$1 break;
            proxy_pass $offre;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # ATS
        location /api/ats/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $ats http://ats-service:8000;
            rewrite ^/api/ats/(.*) /$1 break;
            proxy_pass $ats;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # Email
        location /api/email/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $email http://email-service:8083;
            rewrite ^/api/email/(.*) /$1 break;
            proxy_pass $email;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # Symfony
        location /api/entretiens/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $symfony http://symfony-service:8080;
            rewrite ^/api/entretiens/(.*) /$1 break;
            proxy_pass $symfony;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # Front Angular
        location / {
            set $front http://front-service:4200;
            proxy_pass $front;
            proxy_set_header Host $host;
        }
    }
}
