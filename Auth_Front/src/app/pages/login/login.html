<section class="auth bg-base d-flex flex-wrap">  
    <div class="auth-left d-lg-block d-none">
        <div class="d-flex align-items-center flex-column h-100 justify-content-center">
            <img src="assets/images/logo.jpg" alt="">
        </div>
    </div>
    <div class="auth-right py-32 px-24 d-flex flex-column justify-content-center">
        <div class="max-w-464-px mx-auto w-100">
            <div>
                <a href="/" class="mb-40 max-w-150-px">
                    <img src="assets/images/logo.jpg" alt="">
                </a>
                <h4 class="mb-12">Sign In to your Account</h4>
                <p class="mb-32 text-secondary-light text-lg">Welcome back! please enter your detail</p>
            </div>

            <!-- Message d'erreur affiché si errorMessage n'est pas vide -->
            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

            <!-- (ngSubmit) appelle onLogin() quand on soumet le formulaire -->
            <form (ngSubmit)="onLogin()" #loginForm="ngForm">
                
                <!-- [(ngModel)] lie le champ email à la variable email dans login.component.ts -->
                <div class="icon-field mb-16">
                    <span class="icon top-50 translate-middle-y">
                        <iconify-icon icon="mage:email"></iconify-icon>
                    </span>
                    <input type="email" 
                           class="form-control h-56-px bg-neutral-50 radius-12" 
                           placeholder="Email"
                           [(ngModel)]="email"
                           name="email"
                           required>
                </div>

                <!-- [(ngModel)] lie le champ password à la variable password -->
                <div class="position-relative mb-20">
                    <div class="icon-field">
                        <span class="icon top-50 translate-middle-y">
                            <iconify-icon icon="solar:lock-password-outline"></iconify-icon>
                        </span> 
                        <input type="password" 
                               class="form-control h-56-px bg-neutral-50 radius-12" 
                               placeholder="Password"
                               [(ngModel)]="password"
                               name="password"
                               required>
                    </div>
                </div>

                <!-- [disabled] desactive le bouton pendant le chargement -->
                <!-- {{ }} affiche le texte dynamiquement -->
                <button type="submit" 
                        class="btn btn-primary text-sm btn-sm px-12 py-16 w-100 radius-12 mt-32"
                        [disabled]="isLoading">
                    {{ isLoading ? 'Connexion...' : 'Sign In' }}
                </button>

                <div class="mt-32 text-center text-sm">
                    <p class="mb-0">Don't have an account? 
                        <!-- routerLink navigate vers /register sans recharger la page -->
                        <a routerLink="/register" class="text-primary-600 fw-semibold">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>
