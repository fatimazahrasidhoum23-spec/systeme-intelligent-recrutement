security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Provider stateless — l'utilisateur vient du JWT, pas d'une base de données
        jwt_provider:
            memory:
                users: []

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            stateless: true
            provider: jwt_provider
            custom_authenticators:
                - App\Security\JwtAuthenticator

    access_control:
        # Entretiens : RH et Technique uniquement
        - { path: ^/api/entretiens, roles: [ROLE_RH, ROLE_TECHNIQUE] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
