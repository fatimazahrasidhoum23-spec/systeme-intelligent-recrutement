framework:
    messenger:
        failure_transport: failed

        transports:
            # Transport RabbitMQ — écoute la queue publiée par OffreRh (Spring Boot)
            rabbitmq:
                dsn: '%env(RABBITMQ_DSN)%'
                options:
                    exchange:
                        name: ats.exchange
                        type: topic
                    queues:
                        candidature.preselectionne.queue:
                            binding_keys: ['candidature.preselectionne']
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Message reçu depuis RabbitMQ — OffreRh publie quand candidat accepté
            App\Message\CandidaturePreselectionneeMessage: rabbitmq

            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
